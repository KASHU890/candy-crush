<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6a3ab2" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Candy Crush - Match 3 Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">

    <header class="brand">
      <span class="brand-title">🍬 Candy Crush</span>
    </header>

    <!-- LEVEL MAP -->
    <section id="mapView" class="view">
      <header class="map-header">
        <h2>Choose a Level</h2>
        <span class="map-stats" id="mapProgress"></span>
      </header>
      <div class="diff-row" id="diffRow">
        <button type="button" class="diff-btn" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn active" data-diff="medium">Medium</button>
        <button type="button" class="diff-btn" data-diff="hard">Hard</button>
      </div>
      <div id="mapList" class="map-list"></div>
    </section>

    <!-- GAME -->
    <section id="gameView" class="view hidden">
      <header class="hud">
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Moves</span>
          <span class="hud-value" id="moves">30</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Level</span>
          <span class="hud-value" id="level">1</span>
        </div>
        <div class="hud-item" id="targetBox">
          <span class="hud-label">Target</span>
          <span class="hud-value" id="target">1000</span>
        </div>
      </header>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="board-wrapper">
        <div class="board" id="board"></div>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <h1 id="overlayTitle">Level 1</h1>
            <p id="overlayText"></p>
            <div class="overlay-stars hidden" id="overlayStars"></div>
            <div class="overlay-actions">
              <button type="button" id="overlayMapBtn">Map</button>
              <button type="button" id="overlayBtn">Play</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="tips">
        <span>🍬 Swap candies to match 3+</span>
        <div class="btn-row">
          <button type="button" class="btn-secondary" id="mapBtn">🗺️ Map</button>
          <button type="button" class="btn-secondary" id="restartBtn">🔄 Restart</button>
        </div>
      </footer>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
